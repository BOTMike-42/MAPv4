<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Author Ranking</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="authors-page">

  <!-- Page tabs -->
  <nav class="tabs">
    <a class="tab" href="index.html">Map</a>
    <a class="tab" href="authors.html">Author profiles</a>
    <a class="tab active" href="ranking.html">Ranking</a>
  </nav>

  <main class="authors-main">
    <h1>Author ranking</h1>
    <p id="ranking-status" class="intro">Loading ranking…</p>

    <!-- Filled in by ranking.js; click a name to open that author's profile -->
    <table id="ranking-table" hidden>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Author</th>
          <th class="number">Points</th>
          <th class="number">First</th>
          <th class="number">Middle</th>
          <th class="number">Last</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script src="ranking.js"></script>
</body>
</html>
